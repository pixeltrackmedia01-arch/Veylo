# Calls the batch-processing endpoint every 15 minutes.
# Configure repository secrets: APP_URL (e.g. https://groupdrive.example.com) and CRON_SECRET.
# Alternatively use Hostinger's cron jobs or Supabase pg_cron (see README "Scheduled jobs").
name: Batch scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  process-batches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger batch processing
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/process-batches"
